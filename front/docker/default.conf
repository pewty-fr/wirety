# Wirety front: the single-page app on port 8080.
#
# /api is served by the Wirety server: an ingress routes it there (Helm chart),
# or this nginx proxies it when API_PROXY_ENABLED=true — the location is then
# generated in /etc/nginx/wirety.d/ by
# /docker-entrypoint.d/40-wirety-api-proxy.sh.

# WebSocket upgrades through the proxy (agents' /api/v1/ws).
map $http_upgrade $wirety_connection_upgrade {
    default upgrade;
    ""      "";
}

# The scheme the browser used, when a load balancer in front terminates TLS.
map $http_x_forwarded_proto $wirety_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/wirety.d/*.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
